<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660"
     font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3.2 L0,6.4 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="40" y="24" width="520" height="44" rx="9" fill="#ffffff" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="52" text-anchor="middle" font-weight="bold" fill="#022851">Promoted peaks (Stage 3) · active FT · Stage 2 noise</text>
  <path d="M300,68 V92" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- build phase -->
  <rect x="40" y="92" width="520" height="58" rx="9" fill="#eef1f4" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="118" text-anchor="middle" font-weight="bold" fill="#022851">Edge-coherence map</text>
  <text x="300" y="139" text-anchor="middle" font-size="13" fill="#495057">threshold the coherence statistic → leakage-touched regions</text>
  <path d="M300,150 V174" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="174" width="520" height="58" rx="9" fill="#eef1f4" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="200" text-anchor="middle" font-weight="bold" fill="#022851">Per-peak proposals</text>
  <text x="300" y="221" text-anchor="middle" font-size="13" fill="#495057">each promoted peak → a tight window (± noise margin)</text>
  <path d="M300,232 V256" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="256" width="520" height="58" rx="9" fill="#eef1f4" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="282" text-anchor="middle" font-weight="bold" fill="#022851">Strong-cluster grouping</text>
  <text x="300" y="303" text-anchor="middle" font-size="13" fill="#495057">lines sharing one leakage region → a joint window</text>
  <path d="M300,314 V338" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="338" width="520" height="58" rx="9" fill="#eef1f4" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="364" text-anchor="middle" font-weight="bold" fill="#022851">Disjoint spans</text>
  <text x="300" y="385" text-anchor="middle" font-size="13" fill="#495057">merge overlaps; cap-split over-wide content; trim to peaks</text>
  <path d="M300,396 V420" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- attach + order phase -->
  <rect x="40" y="420" width="520" height="58" rx="9" fill="#fff6db" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="446" text-anchor="middle" font-weight="bold" fill="#022851">Attach fixed contributors</text>
  <text x="300" y="467" text-anchor="middle" font-size="13" fill="#495057">strong skirts above threshold → frozen terms; prune buried peaks</text>
  <path d="M300,478 V502" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="502" width="520" height="58" rx="9" fill="#fff6db" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="528" text-anchor="middle" font-weight="bold" fill="#022851">Order into parallel batches</text>
  <text x="300" y="549" text-anchor="middle" font-size="13" fill="#495057">topological sort of the dependency graph</text>
  <path d="M300,560 V584" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="40" y="584" width="520" height="44" rx="9" fill="#022851" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="612" text-anchor="middle" font-weight="bold" fill="#ffffff">Window plan → Stage 5</text>
</svg>
