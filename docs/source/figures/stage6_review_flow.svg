<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 488"
     font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#222">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3.2 L0,6.4 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="40" y="24" width="520" height="44" rx="9" fill="#ffffff" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="52" text-anchor="middle" font-weight="bold" fill="#022851">Stage 5 fit + audit record</text>
  <path d="M300,68 V92" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- review run -->
  <rect x="40" y="92" width="520" height="58" rx="9" fill="#eef1f4" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="117" text-anchor="middle" font-weight="bold" fill="#022851">review run</text>
  <text x="300" y="138" text-anchor="middle" font-size="13" fill="#495057">build the attention worklist + final-products table</text>
  <path d="M300,150 V174" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- curate (with self-loop) -->
  <rect x="40" y="174" width="520" height="58" rx="9" fill="#eef1f4" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="199" text-anchor="middle" font-weight="bold" fill="#022851">Curate each flagged window</text>
  <text x="300" y="220" text-anchor="middle" font-size="13" fill="#495057">edit (single-window refit) → user-edited, or accept → reviewed</text>
  <path d="M560,222 Q622,203 560,184" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="628" y="207" font-size="13" fill="#495057">next</text>
  <path d="M300,232 V256" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- decision log -->
  <rect x="40" y="256" width="520" height="58" rx="9" fill="#eef1f4" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="281" text-anchor="middle" font-weight="bold" fill="#022851">Decision log</text>
  <text x="300" y="302" text-anchor="middle" font-size="13" fill="#495057">anchored and replayable; survives an upstream re-run</text>
  <path d="M300,314 V338" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- report run -->
  <rect x="40" y="338" width="520" height="58" rx="9" fill="#fff6db" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="363" text-anchor="middle" font-weight="bold" fill="#022851">report run</text>
  <text x="300" y="384" text-anchor="middle" font-size="13" fill="#495057">calibrated table + self-contained HTML, read-only</text>
  <path d="M300,396 V420" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="40" y="420" width="520" height="44" rx="9" fill="#022851" stroke="#022851" stroke-width="1.8"/>
  <text x="300" y="448" text-anchor="middle" font-weight="bold" fill="#ffffff">Finalized line list + report</text>
</svg>
