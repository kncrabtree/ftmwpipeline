name: ftmwpipeline
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.9

  # Core scientific computing dependencies (runtime)
  - numpy>=1.21.0
  - scipy>=1.7.0
  - matplotlib>=3.5.0
  - pandas>=1.3.0
  - h5py>=3.1.0
  - pyyaml>=6.0
  - tqdm>=4.60.0
  - threadpoolctl>=3.0.0

  # Install the package itself in editable mode
  - pip
  - pip:
    - -e .
