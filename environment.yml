name: ftmwpipeline
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.9
  
  # Core scientific computing dependencies
  - numpy>=1.21.0
  - scipy>=1.7.0
  - matplotlib>=3.5.0
  - pandas>=1.3.0
  - h5py>=3.1.0
  - pyyaml>=6.0
  - tqdm>=4.60.0
  
  # Development dependencies
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - pytest-xdist>=3.0.0
  - black>=22.0.0
  - isort>=5.10.0
  - flake8>=5.0.0
  - mypy>=1.0.0
  - pre-commit>=2.15.0
  
  # Documentation dependencies
  - sphinx>=5.0.0
  - sphinx_rtd_theme>=1.0.0
  - jupyter>=1.0.0
  - ipywidgets>=7.6.0
  - ipykernel>=6.0.0
  
  # Visualization extras (optional but useful)
  - plotly>=5.0.0
  - bokeh>=2.4.0
  - seaborn>=0.11.0
  
  # Build tools
  - setuptools>=61.0
  - wheel
  - build
  
  # Additional useful tools for development
  - git
  - jupyterlab
  - ipython
  
  # pip dependencies that might not be available via conda
  - pip
  - pip:
    - sphinx-autodoc-typehints>=1.19.0
    - nbsphinx>=0.8.0