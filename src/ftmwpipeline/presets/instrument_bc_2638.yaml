name: instrument_bc_2638
description: |
  Stage 5 settings for the BlackChirp 2638 fixture. Gaussian shape with
  per-band tau routing on, and a light τ-prior (``tau_penalty_lambda: 50``)
  that suppresses runaway τ in weak windows without pulling well-fit windows
  off their data-driven values. Knobs left unset fall through to the
  resolver's hard defaults.

  Sweep evidence (382 windows, scratch/gaussian-retune/):

  * ``tau_penalty_lambda`` -- λ=50 dominates the stock λ=500 on every χ²ᵣ
    statistic (median 1.36 vs 1.41, mean 3.17 vs 3.45, p90 3.77 vs 5.00)
    and on runaway suppression (99.6% of free-τ windows within 2σ of the
    per-band anchor vs 78% at λ=0). The cliff is between λ=0 and λ=50:
    smaller λ leaves a long runaway tail (max |z|=5σ); larger λ keeps
    centering already-good fits and degrades χ²ᵣ.

  * ``max_decay_factor`` -- k ∈ {1.5, 2, 3, 5, 8} all produce identical
    median / p25 / p75 / p90 χ²ᵣ to 3 decimals at λ=500; differences are
    LSQ basin-hopping noise on 1-2 windows. Kept at the stock k=5.

fit:
  shape: gaussian
  tau:
    per_band_tau: true
    tau_penalty_lambda: 50
