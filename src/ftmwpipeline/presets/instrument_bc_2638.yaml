name: instrument_bc_2638
stage5:
  spur:
    # Instrument clock tree (see dev-docs/planning/instrument-clock-declaration.md).
    # Chain fundamentals only -- harmonics/products derive. The dual-output
    # Valon synth (5120 -> downconversion LO x8 = 40960; 5760 -> upconversion
    # LO x2 = 11520) and the AWG sample clock are Rb-locked: their intermod
    # lattice is the x320 MHz comb the recurring spur catalogue sits on. The
    # scope's interleaved-ADC fundamental (6250 = 50 GSa/s / 8) is the one
    # free-running source: its tone family drifts against the Rb axis.
    # The AWG's half-rate product (fs/2 = 8000; the bb-8000 tone is among the
    # strongest measured) is declared as its own fundamental: division is not
    # a generated product, and without it the locked gcd is 640 instead of
    # the 320 the measured comb requires (32960 = bb 8000 = 320x25 is not a
    # x640 point).
    clocks:
      - {freq_mhz: 5120, locked: true, label: synth-downconv}
      - {freq_mhz: 5760, locked: true, label: synth-upconv}
      - {freq_mhz: 16000, locked: true, label: awg}
      - {freq_mhz: 8000, locked: true, label: awg-half}
      - {freq_mhz: 6250, locked: false, label: scope-adc}
    # Strong gated tones need a wider residual mask than the fixed 2-bin
    # default (a sinc skirt falls ~1/(pi*bins)): scale with the tone's SNR.
    mask_target_residual_snr: 2.0
description: |
  Stage 5 settings for the Blackchirp 2638 fixture. This preset is
  intentionally minimal: every field that 2638 calibration would have
  pinned -- the Gaussian line shape, per-band tau routing, the
  tau-prior strength -- is now the package-wide hard default, and the
  shape is additionally written to the file by Stage 2b's
  auto-recommendation pass. The preset is kept as a stable name for
  workflows that pin the instrument explicitly; future 2638-specific
  knobs (when calibrated) land in this file.

  Sweep evidence the 2638 calibration produced, archived here for
  posterity (382 windows, scratch/gaussian-retune/, against the
  shape-aware-classifier Stage 2b tau_G anchors: band-wide 6.41 us;
  low / mid / high 8.34 / 6.63 / 6.26 us):

  * ``tau_penalty_lambda`` -- the cliff is between lambda=0 and
    lambda=50. At lambda=0 the free-tau distribution sprawls (28.9 %
    of free-tau windows within +/-1 sigma of their band anchor,
    p50 |z| = 1.89, p90 |z| = 5.00); lambda=50 collapses the
    distribution onto its anchor (92.3 % within +/-1 sigma, p50 |z| =
    0.05, p90 |z| = 0.90) at a 5 % cost on the bulk-chi^2_r median
    (1.32 -> 1.39). lambda >= 250 keeps tightening tau (|z|<=1 sigma
    climbs to 98-99 %) but degrades the bulk-chi^2_r tail (mean 3.32
    -> 3.83 as lambda goes 50 -> 2500); the marginal compliance the
    higher lambda buys is not worth the cost on the bulk-fit quality.
    Promoted to the package-wide default.

  * ``max_decay_factor`` -- k in {1.5, 2, 3, 5, 8} all produce
    identical median / p25 / p75 / p90 chi^2_r to 3 decimals at
    lambda=500; differences are LSQ basin-hopping noise on 1-2
    windows. Kept at the stock k=5.
