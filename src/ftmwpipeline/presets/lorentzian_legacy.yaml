name: lorentzian_legacy
description: |
  Stage 5 defaults with the historical Lorentzian (exp(-t/tau)) line shape.
  This is what fit_peaks() produces when called with no arguments and no
  persisted/recommended layer on the .ftmw file. Useful as an explicit
  reference for A/B comparisons against the Gaussian path or against any
  instrument preset.

stage5:
  shape: lorentzian
