name: tests

# Manual-only for now: development happens directly on main, so the suite is
# run on demand from the Actions tab. Closer to release, enable automatic runs
# by replacing the `on:` block below with:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#     workflow_dispatch:
#
# The fast subset (`-m "not slow"`) is the intended per-commit gate; run the
# full suite (drop the marker filter) on a schedule or on release tags.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Endpoints of the supported range (requires-python >=3.9).
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run test suite (excluding slow tests)
        run: pytest -m "not slow"
