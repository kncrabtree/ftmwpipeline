[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftmwpipeline"
dynamic = ["version"]
description = "A Python package for FTMW spectroscopy signal processing and peak fitting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kyle N. Crabtree", email = "kncrabtree@ucdavis.edu"}
]
maintainers = [
    {name = "Kyle N. Crabtree", email = "kncrabtree@ucdavis.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = ["spectroscopy", "FTMW", "signal-processing", "peak-fitting", "scientific-computing"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "h5py>=3.1.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0",
    # Cross-backend BLAS/OpenMP thread limiting for the Stage 5 fork pool: the
    # workers must run single-threaded BLAS to avoid N-workers x M-threads
    # oversubscription, and threadpoolctl re-limits the already-loaded runtime
    # (OpenBLAS / MKL / BLIS / Accelerate) at fork time -- an env var cannot,
    # the backend reads it only at init, which has already happened.
    "threadpoolctl>=3.0.0",
    # 0.1.0rc2+ (the 2.0 pre-release line) exposes BCFTMW.get_fid /
    # BCFid.is_lower_sideband and the version-tolerant enum parsing the
    # Blackchirp loader delegates to. The stable 0.0.11 release predates them.
    "blackchirp>=0.1.0rc2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    # Lets flake8 read the [tool.flake8] config from pyproject.toml (flake8 does
    # not read pyproject natively), so local and CI linting agree.
    "Flake8-pyproject>=1.2.0",
    "mypy>=1.0.0",
    "pre-commit>=2.15.0",
    # Release tooling: build sdist/wheel and validate the package metadata.
    "build>=1.0.0",
    "twine>=4.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipywidgets>=7.6.0",
    "ipykernel>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/kncrabtree/ftmwpipeline"
Documentation = "https://ftmwpipeline.readthedocs.io/"
Repository = "https://github.com/kncrabtree/ftmwpipeline.git"
"Bug Tracker" = "https://github.com/kncrabtree/ftmwpipeline/issues"

[project.scripts]
ftmwpipeline = "ftmwpipeline.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ftmwpipeline.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ftmwpipeline = ["presets/*.yaml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=ftmwpipeline",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
# Every test that needs a real file imports its own .ftmw, and a .ftmw is ~5.7 MB
# because it carries a 750k-point float64 FID that gzip cannot compress. A full
# suite writes ~800 of them (~4.2 GB), and pytest's default policy keeps the last
# three runs' trees -- enough to fill a 16 GB /tmp tmpfs on the third consecutive
# run, where the ENOSPC surfaces as ordinary assertion failures rather than as a
# disk error. Keep the tree only for tests that failed, which is when it is worth
# opening.
tmp_path_retention_policy = "failed"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["src/ftmwpipeline"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["ftmwpipeline"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "h5py.*",
    "pandas.*",
    "blackchirp.*",
    "threadpoolctl.*",
]
ignore_missing_imports = true