name: ftmwpipeline-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.9

  # Core scientific computing dependencies (runtime)
  - numpy>=1.21.0
  - scipy>=1.7.0
  - matplotlib>=3.5.0
  - pandas>=1.3.0
  - h5py>=3.1.0
  - pyyaml>=6.0
  - tqdm>=4.60.0

  # Testing
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - pytest-xdist>=3.0.0

  # Linting / formatting / typing
  - black>=22.0.0
  - isort>=5.10.0
  - flake8>=5.0.0
  - mypy>=1.0.0
  - pre-commit>=2.15.0

  # Documentation tooling is installed via the pip ``docs`` extra below,
  # which is the single source of truth for the doc-build dependency set.

  # Interactive / build tooling
  - jupyterlab
  - ipython
  - ipykernel>=6.0.0
  - ipywidgets>=7.6.0
  - setuptools>=61.0
  - wheel
  - build
  - git

  # Package (editable) plus pip-only doc dependencies
  - pip
  - pip:
    - -e .[dev,docs]
