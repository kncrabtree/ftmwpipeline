name: ftmwpipeline-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python>=3.9
  
  # Core dependencies only
  - numpy>=1.21.0
  - scipy>=1.7.0
  - matplotlib>=3.5.0
  - pandas>=1.3.0
  - h5py>=3.1.0
  - pyyaml>=6.0
  - tqdm>=4.60.0
  
  # Essential development tools
  - pytest>=7.0.0
  - jupyter
  - ipython
  
  # Build tools
  - setuptools>=61.0
  - wheel
  - pip
  
  # Install package in development mode
  - pip:
    - -e .